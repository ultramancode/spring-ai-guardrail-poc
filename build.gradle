plugins {
    id 'java'
    id 'org.springframework.boot' version '3.5.6'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.ultramancode'
version = '0.0.1-SNAPSHOT'
description = 'Spring AI Guardrail PoC - Korean PII Masking with Presidio'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

configurations {
    compileOnly {
        extendsFrom annotationProcessor
    }
}

repositories {
    mavenCentral()
    maven { url 'https://repo.spring.io/milestone' }
    maven { url 'https://repo.spring.io/snapshot' }
    maven { url "https://jitpack.io" } // For ai.philterd:phileas if needed, though 3.1.0 implies maven/central usually
}

ext {
    set('springAiVersion', "1.1.0")
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-webflux'
    implementation 'org.springframework.boot:spring-boot-starter-aop'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    
    // Observability (OTel & Langfuse)
    implementation 'io.micrometer:micrometer-tracing-bridge-otel'
    implementation 'io.opentelemetry:opentelemetry-exporter-otlp'
    implementation 'com.langfuse:langfuse-java:0.1.2' // Latest stable as of knowledge cutoff
    
    // Spring AI BOM
    implementation platform("org.springframework.ai:spring-ai-bom:${springAiVersion}")
    implementation 'org.springframework.ai:spring-ai-starter-mcp-client'

    // Spring AI - Google GenAI (Gemini)
    implementation 'org.springframework.ai:spring-ai-starter-model-google-genai'
    
    // Spring AI - Ollama (Local LLM)
    implementation 'org.springframework.ai:spring-ai-starter-model-ollama'
    
    // PII Protection
    implementation 'ai.philterd:phileas:3.1.0'
    
    // PDF Parsing (for multi-modal demo)
    implementation 'org.apache.pdfbox:pdfbox:3.0.3'

    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

dependencyManagement {
    imports {
        mavenBom "org.springframework.ai:spring-ai-bom:${springAiVersion}"
    }
}

tasks.named('test') {
    useJUnitPlatform()
}

tasks.named('bootRun') {
    doFirst {
        def envFile = file('.env')
        if (envFile.exists()) {
            envFile.readLines().each { line ->
                if (!line.isEmpty() && !line.startsWith('#')) {
                    def (key, value) = line.tokenize('=')
                    if (key && value) {
                        environment key.trim(), value.trim()
                    }
                }
            }
        }
    }
}
