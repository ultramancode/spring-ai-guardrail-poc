nlp_configuration:
  nlp_engine_name: transformers
  models:
    - lang_code: ko
      model_name:
        spacy: ko_core_news_md
        transformers: /app/models/ko_ner
    - lang_code: en
      model_name:
        spacy: en_core_web_lg
        transformers: /app/models/en_ner
  ner_model_configuration:
    labels_to_ignore: [O]
    aggregation_strategy: "simple"
    stride: 16
    alignment_mode: "expand"
    model_to_presidio_entity_mapping:
      PER: PERSON
      PS: PERSON
      LOC: LOCATION
      LC: LOCATION
      ORG: ORGANIZATION
      OG: ORGANIZATION
      QT: QUANTITY
