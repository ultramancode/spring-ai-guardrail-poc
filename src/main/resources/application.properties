spring.application.name=spring-ai-guardrail-poc
spring.config.import=optional:file:.env[.properties]
# Google GenAI (Gemini) API Key - Set GOOGLE_GENAI_API_KEY env var
spring.ai.google.genai.api-key=${GOOGLE_GENAI_API_KEY}
spring.ai.google.genai.chat.options.model=${GEMINI_MODEL:gemini-2.0-flash}
spring.ai.google.genai.chat.options.temperature=${GEMINI_TEMP:0.0}
# Presidio Analyzer URL (Default: localhost:5001)
presidio.analyzer.url=${PRESIDIO_URL:http://localhost:5001}
# General Chat Mapping
chat.client.default.model=googleGenAiChatModel
# Observability (Langfuse OTel)
management.tracing.enabled=true
management.tracing.sampling.probability=1.0
# [Modified] Externalized URL for OTel Endpoint
management.otlp.tracing.endpoint=${LANGFUSE_OTEL_ENDPOINT:http://localhost:3000/api/public/otel/v1/traces}
management.otlp.tracing.headers.Authorization=${OTEL_EXPORTER_OTLP_HEADERS}
# Enable content tracing (Input/Output visible in Langfuse)
# Model Level
spring.ai.chat.observations.log-prompt=true
spring.ai.chat.observations.log-completion=true
# Client Level
spring.ai.chat.client.observations.log-prompt=true
spring.ai.chat.client.observations.log-completion=true
# Tool Level
spring.ai.tools.observations.include-content=true
# Langfuse SDK Config
langfuse.public-key=${LANGFUSE_PUBLIC_KEY}
langfuse.secret-key=${LANGFUSE_SECRET_KEY}
# [Modified] Externalized URL for Langfuse Host
langfuse.host=${LANGFUSE_HOST:http://localhost:3000}
langfuse.prompt-label=${LANGFUSE_PROMPT_LABEL:production}
# Start MCP Server
spring.ai.mcp.client.enabled=true
spring.ai.mcp.client.initialized=false
spring.ai.mcp.client.toolcallback.enabled=false
# [Modified] Externalized URL for MCP Server
spring.ai.mcp.client.sse.connections.demo-server.url=${MCP_SERVER_URL:http://localhost:8081}
spring.ai.mcp.client.sse.connections.demo-server.sse-endpoint=/sse
logging.pattern.level=%5p [${spring.application.name:},%X{traceId:-},%X{spanId:-}]
logging.level.io.opentelemetry=DEBUG
logging.level.org.springframework.ai=DEBUG
# PII Guardrail Configuration
guardrail.pii.audit-mode=true
# [New] Whether to trace raw PII content to Langfuse (Security Warning)
guardrail.pii.trace-raw-content=false
guardrail.injection.prompt-name=guardrail-system-prompt
guardrail.pii.language=ko
guardrail.pii.entities=PERSON,LOCATION,ORG
guardrail.pii.prompt-name=pii-system-prompt
guardrail.injection.log-safe-verdicts=true

# Ollama Global Config (Synced from ai-dynamic-guardrail)
spring.ai.ollama.base-url=${OLLAMA_BASE_URL:http://localhost:11434}
spring.ai.ollama.chat.options.model=${OLLAMA_MODEL:gpt-oss:20b}
spring.ai.ollama.chat.options.temperature=0.7